codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: '70...100'

  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: 80%

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      macro: false
      method: false

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  require_changes: false

ignore:
  - 'src/**/index.ts'
  - '**/*.d.ts'
  - 'tests/**/*'
