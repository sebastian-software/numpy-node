name: Publish

on:
  release:
    types: [published] # Triggered when release-please creates a release
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  id-token: write # Required for npm provenance / trusted publishing

jobs:
  build-native:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          # darwin-x64 removed: GitHub retired all Intel Mac runners
          # Intel Mac users can build from source
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: win32
            arch: x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Install OpenBLAS and LAPACK (Windows)
        if: matrix.os == 'win32'
        run: |
          vcpkg install openblas:x64-windows lapack-reference:x64-windows
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pnpm install

      - name: Build native module
        run: pnpm build:native

      - name: Copy binary to platform package
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.os }}-${{ matrix.arch }}
          cp build/Release/numpy_node_native.node packages/${{ matrix.os }}-${{ matrix.arch }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/${{ matrix.os }}-${{ matrix.arch }}/numpy_node_native.node

  publish:
    name: Publish packages
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Copy binaries to platform packages
        run: |
          for platform in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            cp artifacts/native-$platform/numpy_node_native.node packages/$platform/
          done

      - name: Install dependencies
        run: pnpm install

      - name: Build TypeScript
        run: pnpm build

      - name: Sync version to platform packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Update platform package versions
          node -e "
            const fs = require('fs');
            const version = '$VERSION';
            const platforms = ['darwin-arm64', 'linux-x64', 'linux-arm64', 'win32-x64'];
            for (const platform of platforms) {
              const pkgPath = 'packages/' + platform + '/package.json';
              const json = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              json.version = version;
              fs.writeFileSync(pkgPath, JSON.stringify(json, null, 2) + '\n');
            }
            // Also update optionalDependencies in main package
            const mainPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (mainPkg.optionalDependencies) {
              for (const dep of Object.keys(mainPkg.optionalDependencies)) {
                mainPkg.optionalDependencies[dep] = version;
              }
              fs.writeFileSync('package.json', JSON.stringify(mainPkg, null, 2) + '\n');
            }
          "

      - name: Publish platform packages (dry run)
        if: ${{ inputs.dry-run == true }}
        run: |
          echo "Dry run - would publish version $VERSION"
          for platform in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            echo "Would publish packages/$platform"
            ls -la packages/$platform/
          done

      - name: Publish platform packages
        if: ${{ inputs.dry-run != true }}
        run: |
          for platform in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            cd packages/$platform
            npm publish --access public --provenance
            cd ../..
          done

      - name: Publish main package (dry run)
        if: ${{ inputs.dry-run == true }}
        run: |
          echo "Would publish main package version $VERSION"
          ls -la dist/

      - name: Publish main package
        if: ${{ inputs.dry-run != true }}
        run: npm publish --access public --provenance
